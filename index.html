<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form id="orderForm" action="thankyou.html">
        <div>
            <label for="customerName">Your Name:</label>
            <input type="text" id="customerName">
            <p id="nameError" class="error"></p>
            
            <label for="customerPhone">Your Phone Number:</label>
            <input type="tel" id="customerPhone">
            <p id="phoneError" class="error"></p>
        </div>
        
        <div>
            <label for="pizzaSelect">Please select the pizza you would like to order:</label>
            <select id="pizzaSelect"></select>
            <p id="pizzaError" class="error"></p>
            
            <label for="quantitySelect">Please select the number of pizzas you would like:</label>
            <select id="quantitySelect"></select>
            <p id="quantityError" class="error"></p>
        </div>
        
        <button type="submit"></button>
    </form>
</body>
</html>
